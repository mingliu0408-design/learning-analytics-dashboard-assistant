name: LAD no-key validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ''
      PYTHONDONTWRITEBYTECODE: '1'
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install the tested public environment
        run: python -m pip install -r requirements.txt
      - name: Scan all publication candidates without showing credential values
        run: python scripts/security_scan.py --repo .
      - name: Run existing and publication regression checks
        run: python -m unittest discover -s tests -v
      - name: Run preserved research checks
        working-directory: research
        run: |
          python -m unittest discover -s checks -p 'test_*.py' -v
          python checks/check_snapshot.py
          python checks/check_rq3.py
      - name: Start the public entrypoint and verify Streamlit health
        run: |
          python -m streamlit run app.py --server.headless=true --server.port=8501 > /tmp/lad-streamlit.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid"' EXIT
          python - <<'PYHEALTH'
          import time
          from urllib.request import urlopen
          for attempt in range(40):
              try:
                  with urlopen('http://localhost:8501/_stcore/health', timeout=2) as response:
                      assert response.read().strip() == b'ok'
                      break
              except OSError:
                  time.sleep(0.5)
          else:
              raise SystemExit('Streamlit health did not become ready')
          PYHEALTH
